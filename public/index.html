<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Gateway</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8f8f8; }
        .container { max-width: 700px; margin: 40px auto; background: #eee; border-radius: 12px; padding: 32px 32px 24px 32px; box-shadow: 0 2px 8px #0001; }
        h1, h2 { color: #c9a43a; margin-bottom: 8px; }
        h2 { font-size: 1.2em; margin-top: 32px; }
        label { display: block; margin: 12px 0 4px 0; font-weight: bold; }
        input, select, textarea { width: 75%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; margin-bottom: 8px; }
        .row { display: flex; gap: 16px; }
        .row > div { flex: 1; }
        .section { background: #f5f5f5; border-radius: 8px; padding: 18px 18px 8px 18px; margin-bottom: 18px; }
        .checkbox-row { display: flex; align-items: center; margin-bottom: 12px; }
        .checkbox-row input[type=checkbox] { width: auto; margin-right: 8px; }
        .pay-btn { background: #4caf50; color: #fff; border: none; padding: 12px 32px; border-radius: 6px; font-size: 1.1em; cursor: pointer; margin-top: 8px; }
        .pay-btn:disabled { background: #aaa; cursor: not-allowed; }
        .error { color: #d32f2f; margin-bottom: 8px; }
        .success { color: #388e3c; margin-bottom: 8px; }
        .card-icons { margin-top: 16px; }
        .card-icons img { height: 32px; margin-right: 8px; vertical-align: middle; }
        .required { color: #d32f2f; }
        .payment-link { margin-top: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Payment</h1>
        <form id="registerOrderForm">
            <div class="section">
                <h2>Personal details</h2>
                <div class="row">
                    <div><label>First Name <span class="required">*</span></label><input type="text" id="firstName" required></div>
                    <div><label>Last Name <span class="required">*</span></label><input type="text" id="lastName" required></div>
                </div>
                <div class="row">
                    <div><label>Mobile</label><input type="text" id="mobile"></div>
                    <div><label>Email Address <span class="required">*</span></label><input type="email" id="email" required></div>
                </div>
            </div>
            <div class="section">
                <h2>Payment details</h2>
                <div class="row">
                    <div><label>Amount <span class="required">*</span></label><input type="number" id="regAmount" required></div>
                    <div><label>Currency <span class="required">*</span></label>
                        <select id="currency" required>
                            <option value="EGP">EGP</option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div><label>Promo Code</label><input type="text" id="promoCode"></div>
                    <div><label>Service</label><input type="text" id="service"></div>
                </div>
                <label>Notes</label><textarea id="notes" rows="2"></textarea>
                <div class="checkbox-row">
                    <input type="checkbox" id="agree" required>
                    <label for="agree" style="margin:0; font-weight:normal;">Agree on <a href="#" target="_blank">terms and conditions</a> <span class="required">*</span></label>
                </div>
            </div>
            <button type="submit" class="pay-btn">Pay now</button>
            <div id="registerOrderResult"></div>
            <div class="card-icons">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/Visa.svg" alt="Visa">
                <img src="https://toppng.com/uploads/preview/mastercard-logo-blue-vector-master-card-logo-11563336609mkav9reydn.png" alt="MasterCard">
                <img src="https://zeed.tech/wp-content/uploads/2022/04/NBE0.png" alt="NBE" style="height:28px;">
                <img src="https://media.licdn.com/dms/image/v2/C4D0BAQHZO1q5WQn6mA/company-logo_200_200/company-logo_200_200/0/1677076088730?e=2147483647&v=beta&t=7CabkzbU89wxK22iHnrWoHurZZvjZwDTYJ-THHVvoX8" alt="Tally" style="height:28px;">
                <span style="margin-left:8px; color:#555;">We accept cards</span>
            </div>
            <div style="margin-top:8px; font-size:0.95em; color:#d32f2f;">* : required input</div>
        </form>
    </div>
<script>
document.getElementById('registerOrderForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const resultDiv = document.getElementById('registerOrderResult');
    resultDiv.className = '';
    resultDiv.textContent = '';

    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('email').value.trim();
    const amount = document.getElementById('regAmount').value.trim();
    const currency = document.getElementById('currency').value;
    const agree = document.getElementById('agree').checked;

    if (!firstName || !lastName || !email || !amount || !currency || !agree) {
        resultDiv.className = 'error';
        resultDiv.textContent = 'Please fill all required fields and agree to the terms.';
        return;
    }

    const orderNumber = 'ORDER' + Date.now();

    const params = new URLSearchParams({
        userName: 'Booking_api',
        password: 'Admin@1234',
        orderNumber,
        amount,
        currency: currency === 'EGP' ? '818' : currency,
        returnUrl: 'https://tally-payment-production.up.railway.app/',
        features: 'FORCE_SSL'
    });

    resultDiv.textContent = 'Processing...';

    try {
        const res = await fetch('/api/register-order', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: params
        });

        const result = await res.json();

        if (res.ok && result.formUrl) {
            // ✅ نعمل redirect مباشر
            window.location.href = result.formUrl;
        } else {
            resultDiv.className = 'error';
            resultDiv.innerHTML = `<b>Register Order Error:</b><br><pre>${JSON.stringify(result, null, 2)}</pre>`;
        }
    } catch (err) {
        resultDiv.className = 'error';
        resultDiv.innerHTML = `<b>Network Error:</b> ${err.message}`;
    }
});
</script>

</body>
</html>
