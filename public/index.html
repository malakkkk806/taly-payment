<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Gateway</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      width: 100%;
      margin: 20px;
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 8px #0002;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .header h1 {
      color: #c9a43a;
      font-size: 1.8em;
      margin: 0;
    }
    h2 {
      color: #c9a43a;
      margin-bottom: 12px;
      font-size: 1.2em;
    }
    .section {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .row {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .row > div {
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
      min-width: 250px;
    }
    .row i {
      position: absolute;
      left: 10px;
      color: #777;
      z-index: 1;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 10px 10px 35px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 0.95em;
      box-sizing: border-box;
    }
    textarea {
      padding-left: 10px;
    }
    .button-container {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }
    .pay-btn { 
      background: #000; 
      color: #fff; 
      border: none; 
      padding: 12px 32px; 
      border-radius: 6px; 
      font-size: 1.1em; 
      cursor: pointer; 
      transition: background 0.3s ease, color 0.3s ease;
      min-width: 180px;
    }
    .pay-btn:hover {
      background: #c9a43a; 
      color: #000;
    }
    .pay-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    .required {
      color: #d32f2f;
    }
    .error {
      color: #d32f2f;
      margin-top: 12px;
      padding: 10px;
      background: #fff2f2;
      border-radius: 4px;
      border-left: 4px solid #d32f2f;
    }
    .success {
      color: #388e3c;
      margin-top: 12px;
      padding: 10px;
      background: #f2fff2;
      border-radius: 4px;
      border-left: 4px solid #388e3c;
    }
    .card-icons {
      margin-top: 16px;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .card-icons img {
      height: 40px;
      max-width: 90px;
      object-fit: contain;
    }
    .card-icons span {
      margin-left: 8px;
      color: #555;
      font-size: 0.95em;
    }
    
    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
      .row > div {
        min-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="./images/logo.png" alt="BookingCW Logo" style="height:50px; border-radius:6px; vertical-align:middle;">
     <img src="./images/WhatsApp Image 2025-09-03 at 22.23.51_6b9f199d.jpg" 
     alt="Payment Logo" 
     style="height:65px; border-radius:6px; vertical-align:middle; margin-left:10px;">
    </div>
    <form id="registerOrderForm">
      <div class="section">
        <h2>Personal Details</h2>
        <div class="row">
          <div><i class="fa fa-user"></i><input type="text" placeholder="First Name *" id="firstName" required></div>
          <div><i class="fa fa-user"></i><input type="text" placeholder="Last Name *" id="lastName" required></div>
        </div>
        <div class="row">
          <div><i class="fa fa-mobile-alt"></i><input type="text" placeholder="Mobile" id="mobile"></div>
          <div><i class="fa fa-envelope"></i><input type="email" placeholder="Email Address *" id="email" required></div>
        </div>
      </div>

      <div class="section">
        <h2>Payment Details</h2>
        <div class="row">
          <div><i class="fa fa-money-bill"></i><input type="number" placeholder="Amount *" id="regAmount" required></div>
          <div><i class="fa fa-coins"></i><input type="text" value="EGP" disabled style="background:#eee; font-weight:bold; padding-left:35px;"></div>
        </div>
